<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أبو أحمد للألمنيوم</title>
<meta name="description" content="أبو أحمد للألمنيوم — أبواب وشبابيك وكاونترات ومحجر درج بجودة تصنيع عالية.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --panel:#ffffff; --panel2:#F1F5F9; --line:rgba(15,23,42,.10);
  --text:#0F172A; --muted:#64748B; --accent:#38BDF8; --accent2:#0EA5E9;
  --green:#16A34A; --red:#DC2626; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
a,button,.nav a,.chip,.cat-tile,.prod-card,.icon-btn,.btn,.adm-side a,.tab,header.site{-webkit-user-select:none;user-select:none}
html[data-admin-light="1"]{--bg:#f3f5f6;--panel:#fff;--panel2:#f7f8f9;--line:#e4e8ea;--text:#171b1e;--muted:#66727a}
html,body{overflow-x:hidden;max-width:100vw}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;line-height:1.6}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* header */
header.site{position:sticky;top:0;z-index:40;background:rgba(248,250,252,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1100px;margin:0 auto}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#0284C7);display:grid;place-items:center;font-weight:900;color:#ffffff}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:9px 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.nav a.active,.nav a:hover{color:var(--text);background:var(--panel2)}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;position:relative;flex:0 0 auto}
.cart-badge{position:absolute;top:-6px;left:-6px;background:var(--accent);color:#ffffff;font-size:10px;font-weight:900;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:rgba(56,189,248,.5)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#ffffff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:#ffb4ac;border-color:rgba(226,104,95,.4);background:rgba(226,104,95,.08)}
.btn.block{width:100%}
.btn.sm{padding:8px 11px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* layout helpers */
.section{padding-top:34px;padding-bottom:34px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head h2{margin:0;font-size:21px;font-weight:900}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}}
/* hero */
.hero{position:relative;padding:52px 0 40px;overflow:hidden;background:
  repeating-linear-gradient(115deg, rgba(15,23,42,.035) 0 2px, transparent 2px 26px),
  radial-gradient(circle at 85% 0%, rgba(56,189,248,.16), transparent 45%), var(--bg)}
.hero h1{font-size:34px;line-height:1.25;margin:0 0 10px;font-weight:900;max-width:520px}
.hero .accent{color:var(--accent)}
.hero p{color:var(--muted);max-width:460px;font-size:14px;margin:0 0 20px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
/* category tile */
.cat-tile{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden;cursor:pointer;transition:.15s border-color,.15s transform}
.cat-tile:hover{border-color:rgba(56,189,248,.45);transform:translateY(-2px)}
.cat-tile .thumb{aspect-ratio:4/3;background:var(--panel2);position:relative;overflow:hidden}
.cat-tile .thumb:has(img){aspect-ratio:auto}
.cat-tile .thumb img{width:100%;height:auto;display:block;object-fit:initial}
.cat-tile .thumb .ph{position:absolute;inset:0;background:repeating-linear-gradient(125deg,rgba(15,23,42,.06) 0 3px,transparent 3px 22px)}
.cat-tile .body{padding:13px 14px}
.cat-tile .body b{font-size:15px;font-weight:800}
.cat-tile .body small{color:var(--muted);font-size:11.5px;display:block;margin-top:4px;line-height:1.7}
/* product card */
.prod-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.prod-card .thumb{aspect-ratio:1/1;background:var(--panel2);position:relative}
.prod-card .thumb:has(img){aspect-ratio:auto}
.prod-card .thumb img{width:100%;height:auto;display:block;object-fit:initial}
.prod-card .thumb .ph{position:absolute;inset:0;background:repeating-linear-gradient(125deg,rgba(15,23,42,.06) 0 3px,transparent 3px 22px)}
.prod-card .badge{position:absolute;top:8px;right:8px;background:rgba(15,23,42,.85);border:1px solid var(--line);color:#BAE6FD;font-size:9.5px;font-weight:900;padding:4px 8px;border-radius:999px}
.prod-card .body{padding:11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod-card .code{color:var(--accent2);font-size:10px;font-weight:700}
.prod-card b{font-size:13.5px;font-weight:800}
.prod-card .price{margin-top:auto;font-weight:900;font-size:14px}
.prod-card .price small{color:var(--muted);font-weight:600;font-size:10.5px}
/* filters bar */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#ffffff}
/* product detail */
.pd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:760px){.pd-wrap{grid-template-columns:1fr}}
.pd-gallery{border-radius:18px;overflow:hidden;background:var(--panel);border:1px solid var(--line);aspect-ratio:1/1;position:relative}
.pd-gallery:has(img){aspect-ratio:auto}
.pd-gallery img{width:100%;height:auto;display:block}
.pd-thumbs{display:flex;gap:8px;margin-top:8px}
.pd-thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field select,.field textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px}
.field textarea{min-height:90px;resize:vertical}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-box{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel2);margin:14px 0}
.summary-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--muted)}
.summary-line b{color:var(--text)}
/* cart */
.cart-fab{position:fixed;left:14px;bottom:16px;z-index:50;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:13px 17px;font-weight:900;box-shadow:0 16px 36px rgba(15,23,42,.16);cursor:pointer;display:flex;align-items:center;gap:8px}
.cart-fab span{background:var(--accent);color:#ffffff;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;padding:14px;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
.sheet{max-width:520px;width:100%;margin:24px auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(15,23,42,.22)}
.sheet.wide{max-width:760px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-head h3{margin:0;font-size:18px;font-weight:900}
.sheet-close{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
.cart-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:58px;height:58px;border-radius:10px;object-fit:cover;background:var(--panel2);flex:0 0 auto}
.cart-item .info{flex:1;min-width:0}
.cart-item .info b{font-size:13px}
.cart-item .info small{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.cart-item .qty-x{display:flex;align-items:center;gap:6px;margin-top:6px}
.cart-item .qty-x button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.cart-empty{text-align:center;padding:30px 10px;color:var(--muted)}
/* table (admin) */
.tbl-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.admtbl{width:100%;min-width:560px;border-collapse:collapse;font-size:12.5px}
table.admtbl th{text-align:right;color:var(--muted);font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.admtbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.status-pill{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:800;border:1px solid var(--line)}
.status-pill.new{color:#B45309;border-color:rgba(180,83,9,.3)}
.status-pill.in_progress,.status-pill.contacted{color:#0369A1;border-color:rgba(56,189,248,.35)}
.status-pill.completed,.status-pill.quoted{color:#15803D;border-color:rgba(21,128,61,.3)}
.status-pill.cancelled,.status-pill.closed{color:#64748B}
/* admin shell */
.adm-shell{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
@media(max-width:760px){.adm-shell{grid-template-columns:1fr}}
.adm-side{border-left:1px solid var(--line);background:var(--panel);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
@media(max-width:760px){.adm-side{position:static;height:auto;display:flex;align-items:center;overflow-x:auto;padding:10px;gap:4px;border-left:0;border-bottom:1px solid var(--line)}}
.adm-side a{display:block;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.adm-side a.active{background:var(--accent);color:#ffffff}
.adm-main{padding:20px}
.adm-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.adm-topbar h2{margin:0;font-size:19px;font-weight:900}
.stat-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--panel)}
.stat-card b{font-size:24px;display:block;margin-top:4px}
.stat-card small{color:var(--muted);font-size:11.5px}
.card-list{display:flex;flex-direction:column;gap:8px}
.card-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-item .meta small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.upload-box{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;font-size:12px;color:var(--muted)}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
.img-grid .im{position:relative;border-radius:9px;overflow:hidden;aspect-ratio:1/1;background:var(--panel2)}
.img-grid .im img{width:100%;height:100%;object-fit:cover}
.img-grid .im button{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:6px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer}
.toast{position:fixed;bottom:18px;right:18px;z-index:80;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.toast.err{border-color:rgba(220,38,38,.4);color:#DC2626}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(148,163,184,.35);border-top-color:currentColor;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
footer.site{border-top:1px solid var(--line);padding:26px 0;margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
.empty-state{text-align:center;padding:50px 10px;color:var(--muted)}
.empty-state b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.wa-fab{position:fixed;left:14px;bottom:76px;z-index:45;background:#25d366;color:#08240f;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 12px 26px rgba(15,23,42,.22)}
.glass-table{width:100%;border-collapse:collapse;margin-top:6px}
.glass-table th,.glass-table td{border:1px solid var(--line);padding:8px 6px;text-align:center;font-size:12.5px}
.glass-table th{background:var(--panel2);font-weight:800}
.glass-table input{width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12.5px;text-align:center}
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.gallery-grid{grid-template-columns:repeat(2,1fr)}}
.gallery-item{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1/1;background:var(--panel2)}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-item .cap{position:absolute;bottom:0;right:0;left:0;background:linear-gradient(transparent,rgba(15,23,42,.78));color:#fff;font-size:11px;font-weight:700;padding:18px 10px 8px}
.stat-strip{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.stat-strip .st b{font-size:22px;font-weight:900;display:block}
.stat-strip .st small{font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modals"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://rxbytiypnqmnastydwtl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_EAV6Xz5dUouN8abhz3HbVQ_DnS3XcSi";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CART_KEY = "workshop_cart_v1";
const CUSTOMER_KEY = "workshop_customer_v1";
const RECENT_KEY = "workshop_recent_products_v1";
// مسار لوحة التحكم — غيّره لأي كلمة تفضلها (بدون فراغات)، هذا هو المكان الوحيد اللي تحتاج تعدله
const ADMIN_ROUTE = "krkr-777";
const state = { settings:null, categories:[], session:null, cart: loadCart() };

function loadCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY))||[]; }catch(e){ return []; } }
function saveCart(){ localStorage.setItem(CART_KEY, JSON.stringify(state.cart)); renderCartBadge(); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
// -------------------- بيانات الزبون المحفوظة (لتعبئة تلقائية بالطلب القادم) --------------------
function loadSavedCustomer(){ try{ return JSON.parse(localStorage.getItem(CUSTOMER_KEY))||null; }catch(e){ return null; } }
function saveCustomerInfo(obj){ try{ localStorage.setItem(CUSTOMER_KEY, JSON.stringify(obj)); }catch(e){} }
// -------------------- آخر منتجات تمت زيارتها (محلياً بالمتصفح) --------------------
function loadRecentProducts(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY))||[]; }catch(e){ return []; } }
function pushRecentProduct(id){
  try{
    let list = loadRecentProducts().filter(x=>x!==id);
    list.unshift(id);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0,8)));
  }catch(e){}
}

function toast(msg, isErr){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast'+(isErr?' err':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ n = Number(n||0); return n.toLocaleString('ar-IQ',{maximumFractionDigits:0}) + ' د.ع'; }
// رقم عراقي صحيح: يبدأ بـ07 ويتكون من 11 رقم بالضبط
function isValidIraqiPhone(p){ const digits = String(p||'').replace(/\D/g,''); return /^07\d{9}$/.test(digits); }

// -------------------- pricing engine --------------------
// قاعدة تقريب الورشة: كل بُعد يُعامل بشكل مستقل.
// إذا كان الباقي بعد أقرب 10سم أقل من 5 -> يبقى القياس كما هو (بدون تقريب لأسفل).
// إذا كان 5 أو أكثر -> يُرفع للعشرة التالية فقط.
function roundPricingDim(v, enabled){
  v = Number(v||0);
  if(!enabled) return v;
  const rem = v % 10;
  if(rem === 0) return v;
  if(rem < 5) return v;
  return v + (10 - rem);
}
// محرك تسعير مركزي: يرجع القياس/المساحة الفعلية (بدون تقريب) والمحتسبة للتسعير (بعد التقريب إن كان مفعّلاً) منفصلتين.
// الكاونترات (product.no_rounding === true) لا تُقرَّب أبداً مهما كان إعداد rounding_rule.
function calcLine(product, opts){
  const method = product.pricing_method;
  const price = Number(product.unit_price||0);
  const qty = Number(opts.quantity||1);
  const roundingEnabled = product.rounding_rule === 'round_up_10cm' && !product.no_rounding;
  if(method === 'piece'){
    return { areaOrLength: qty, lineTotal: price*qty, actualArea:null, pricingArea:null, actualW:null, actualH:null, pricingW:null, pricingH:null };
  }
  if(method === 'sqm'){
    const actualW = Number(opts.widthCm||0), actualH = Number(opts.heightCm||0);
    const pricingWcm = roundPricingDim(actualW, roundingEnabled);
    const pricingHcm = roundPricingDim(actualH, roundingEnabled);
    const actualArea = (actualW/100)*(actualH/100)*qty;
    const pricingArea = (pricingWcm/100)*(pricingHcm/100)*qty;
    return { areaOrLength: pricingArea, lineTotal: price*pricingArea, actualArea, pricingArea, actualW, actualH, pricingW:pricingWcm, pricingH:pricingHcm };
  }
  if(method === 'linear_meter'){
    const actualLenCm = Number(opts.widthCm||0);
    const pricingLenCm = roundPricingDim(actualLenCm, roundingEnabled);
    const actualLen = (actualLenCm/100)*qty;
    const pricingLen = (pricingLenCm/100)*qty;
    return { areaOrLength: pricingLen, lineTotal: price*pricingLen, actualArea:actualLen, pricingArea:pricingLen, actualW:actualLenCm, pricingW:pricingLenCm, actualH:null, pricingH:null };
  }
  return { areaOrLength: 0, lineTotal: 0, actualArea:null, pricingArea:null };
}

// -------------------- cart --------------------
function addToCart(product, opts){
  const calc = calcLine(product, opts);
  const item = {
    id: uid(), productId: product.id, name: product.name, code: product.code,
    image: (product.product_images&&product.product_images[0]&&product.product_images[0].url)||null,
    pricingMethod: product.pricing_method, unitPrice: Number(product.unit_price||0),
    roundingRule: product.rounding_rule, noRounding: !!product.no_rounding, quantity: Number(opts.quantity||1),
    widthCm: opts.widthCm||null, heightCm: opts.heightCm||null, note: opts.note||'',
    areaOrLength: calc.areaOrLength, lineTotal: calc.lineTotal,
    actualArea: calc.actualArea, pricingArea: calc.pricingArea,
    pricingW: calc.pricingW||null, pricingH: calc.pricingH||null
  };
  state.cart.push(item); saveCart();

window.cartChangeQty = function(id, delta){
  const item = state.cart.find(i=>i.id===id);
  if(!item) return;
  const newQty = item.quantity + delta;
  if(newQty < 1) return;
  const pseudoProduct = { pricing_method:item.pricingMethod, unit_price:item.unitPrice, rounding_rule:item.roundingRule, no_rounding:item.noRounding };
  const calc = calcLine(pseudoProduct, { quantity:newQty, widthCm:item.widthCm, heightCm:item.heightCm });
  item.quantity = newQty; item.areaOrLength = calc.areaOrLength; item.lineTotal = calc.lineTotal;
  item.actualArea = calc.actualArea; item.pricingArea = calc.pricingArea;
  item.pricingW = calc.pricingW||null; item.pricingH = calc.pricingH||null;
  saveCart(); openCart();
};

// -------------------- تصدير CSV (يفتح مباشرة بـ Excel) --------------------
function toCSVRow(arr){
  return arr.map(v=>{
    let s = v==null? '' : String(v);
    if(/[",\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }).join(',');
}
function downloadCSV(filename, rows){
  const csv = '\uFEFF' + rows.map(toCSVRow).join('\r\n'); // BOM عشان يقرأ العربي صح بـ Excel
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  toast('تم تصدير الملف');
}

window.shareProduct = async function(){
  const p = window.__PD; if(!p) return;
  const url = location.origin + location.pathname + '#/product/' + p.slug;
  const shareData = { title: p.name, text: `${p.name} — ${p.code||''}`, url };
  if(navigator.share){
    try{ await navigator.share(shareData); return; }
    catch(e){ /* المستخدم ألغى المشاركة */ return; }
  }
  try{ await navigator.clipboard.writeText(url); toast('تم نسخ رابط المنتج'); }
  catch(e){ toast('تعذّر نسخ الرابط، انسخه يدوياً', true); }
};

function pdLeaveGuardCheck(){
  const meta = window.__PD_meta;
  if(!meta || !meta.needsDims || !meta.purchasable || window.__pdAdded) return false;
  if(meta.pricingMethod !== 'sqm') return false;
  const wEl = document.getElementById('pdW'), hEl = document.getElementById('pdH');
  if(!wEl || !hEl) return false;
  const wVal = wEl.value.trim(), hVal = hEl.value.trim();
  return Boolean((wVal || hVal) && !(wVal && hVal));
}
function pdLiveUpdate(){
  const p = window.__PD; if(!p) return;
  const qty = Number(document.getElementById('pdQty')?.value||1);
  const w = document.getElementById('pdW')?.value; const h = document.getElementById('pdH')?.value;
  const box = document.getElementById('pdLiveTotal'); if(!box) return;
  if(p.pricing_method==='sqm' && (!w||!h)) { box.textContent='أدخل القياسات أولاً'; return; }
  if(p.pricing_method==='linear_meter' && !w) { box.textContent='أدخل القياس أولاً'; return; }
  const calc = calcLine(p, {quantity:qty, widthCm:w, heightCm:h});
  const roundingApplied = p.pricing_method==='sqm'? (calc.pricingW!==Number(w||0) || calc.pricingH!==Number(h||0))
    : p.pricing_method==='linear_meter'? (calc.pricingW!==Number(w||0)) : false;
  let extra = '';
  if(roundingApplied){
    if(p.pricing_method==='sqm') extra = `<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:4px">القياس الفعلي: ${esc(w)}×${esc(h)} سم · القياس المحتسب للتسعير: ${calc.pricingW}×${calc.pricingH} سم</div>`;
    else extra = `<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:4px">الطول الفعلي: ${esc(w)} سم · الطول المحتسب للتسعير: ${calc.pricingW} سم</div>`;
  }
  box.innerHTML = 'الإجمالي: ' + money(calc.lineTotal) + extra;
}

// -------------------- payment providers (modular) --------------------
// كل مزود دفع إلكتروني حقيقي (مستقبلاً) يُضاف هنا كمفتاح جديد بنفس الشكل:
// zaincash: { label:'زين كاش', async createPayment(order, amount){ /* نداء API الحقيقي هنا */ return {status:'pending', reference:'...'}; } }
// هذا يخلي الموقع غير مرتبط بمزود دفع محدد، ويسهل إضافة مزود لاحقاً بدون إعادة بناء المتجر.
const PaymentProviders = {};
function getActiveElectronicProvider(){
  const s = state.settings||{};
  if(!s.electronic_payment_enabled) return null;
  const key = s.payment_provider||'';
  if(PaymentProviders[key]) return PaymentProviders[key];
  // لا يوجد مزود مبرمج فعلياً بعد؛ نعرض خياراً عاماً بالاسم الذي يحدده المدير ونعلّم الطلب "بانتظار الدفع" لحين ربط مزود حقيقي
  if(s.payment_provider_name) return { label: s.payment_provider_name, async createPayment(){ return {status:'pending', reference:null}; } };
  return null;
}

window.__newOrderCount = 0;
let __orderChannel = null;
function setupOrderAlerts(){
  if(__orderChannel) return;
  __orderChannel = sb.channel('admin-orders-alert')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'orders'}, (payload)=>{
      window.__newOrderCount++;
      playOrderAlertSound();
      updateOrdersBadge();
      toast('🔔 طلب جديد وصل: ' + (payload.new && payload.new.order_number || ''));
    })
    .subscribe();
}
function teardownOrderAlerts(){
  if(__orderChannel){ sb.removeChannel(__orderChannel); __orderChannel = null; }
}
function playOrderAlertSound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.18;
    o.start();
    setTimeout(()=>{ o.frequency.value = 1180; }, 130);
    setTimeout(()=>{ o.stop(); ctx.close(); }, 340);
  }catch(e){ /* المتصفح ما يدعم الصوت التلقائي */ }
}
function updateOrdersBadge(){
  const el = document.getElementById('newOrderBadge');

function fld(f, val){
  val = val==null? '': val;
  if(f.type==='select') return `<div class="field"><label>${f.label}</label><select id="f_${f.key}">${f.options.map(o=>`<option value="${esc(o.value)}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
  if(f.type==='textarea') return `<div class="field"><label>${f.label}</label><textarea id="f_${f.key}">${esc(val)}</textarea></div>`;
  if(f.type==='checkbox') return `<div class="field"><label><input type="checkbox" id="f_${f.key}" ${val?'checked':''} style="width:auto;margin-left:8px">${f.label}</label></div>`;
  return `<div class="field"><label>${f.label}</label><input id="f_${f.key}" type="${f.type||'text'}" value="${esc(val)}"></div>`;
}
function toWesternDigits(s){
  return String(s).replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
}
function readFld(f){
  const el = document.getElementById('f_'+f.key);
  if(f.type==='checkbox') return el.checked;
  if(f.type==='number'){ const raw = toWesternDigits(el.value||'').trim(); return raw===''? null : Number(raw); }
  return el.value.trim()===''? null: el.value.trim();
}

  const rand = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  let base = (name||'').toString().trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  const slug = (base? base+'-':'') + rand;
  const code = 'P-' + rand.toUpperCase();
  return {slug, code};
}

const GLASS_CALC_KEY = "workshop_glass_calc_v1";
function ensureGlassState(){
  if(!window.glassRows){
    try{
      const saved = JSON.parse(localStorage.getItem(GLASS_CALC_KEY));
      if(saved && Array.isArray(saved.rows) && saved.rows.length){
        window.glassRows = saved.rows; window.glassType = saved.type||''; window.glassPhone = saved.phone||'';
      }
    }catch(e){}
  }
  if(!window.glassRows) window.glassRows = [{length:'',width:'',qty:1}];
  if(window.glassType==null) window.glassType = '';
  if(window.glassPhone==null) window.glassPhone = '';
}
function glassSaveState(){
  try{ localStorage.setItem(GLASS_CALC_KEY, JSON.stringify({rows:window.glassRows, type:window.glassType, phone:window.glassPhone})); }catch(e){}
}
function glassRowArea(r){ return (Number(r.length)||0)/30 * (Number(r.width)||0)/30 * (Number(r.qty)||0); }
function cmToFeetLabel(cm){
  cm = Number(cm)||0; if(cm<=0) return '';
  const ft = Math.floor(cm/30); const rem = Math.round(cm - ft*30);
  if(ft<=0) return `${rem}سم`;
  return rem>0? `${ft}فوت ${rem}سم` : `${ft}فوت`;
}
function glassUpdateTotal(){
  const total = window.glassRows.reduce((s,r)=>s+glassRowArea(r),0);
  const el = document.getElementById('glassTotalVal');
  if(el) el.textContent = total.toFixed(2);
}
function glassTableHtml(){
  const rows = window.glassRows;
  const rowsHtml = rows.map((r,i)=>`
    <tr>
      <td><input type="number" min="0" step="0.5" value="${esc(r.length)}" oninput="glassUpdateRow(${i},'length',this.value)">
        <div class="hint" id="glassLenFt_${i}" style="margin-top:3px">${cmToFeetLabel(r.length)}</div></td>
      <td><input type="number" min="0" step="0.5" value="${esc(r.width)}" oninput="glassUpdateRow(${i},'width',this.value)">
        <div class="hint" id="glassWidFt_${i}" style="margin-top:3px">${cmToFeetLabel(r.width)}</div></td>
      <td><input type="number" min="1" step="1" value="${esc(r.qty)}" oninput="glassUpdateRow(${i},'qty',this.value)"></td>
      <td class="mono" id="glassArea_${i}">${glassRowArea(r).toFixed(2)}</td>
      <td><button class="btn sm danger" onclick="glassRemoveRow(${i})">حذف</button></td>
    </tr>`).join('');
  const total = rows.reduce((s,r)=>s+glassRowArea(r),0);
  return `
  <div style="background:var(--panel);padding:14px;border-radius:12px;border:1px solid var(--line)">
    <div style="font-weight:900;font-size:15px;margin-bottom:10px">نوع الزجاج: <span class="mono" id="glassTypeDisplay">${esc(window.glassType||'—')}</span></div>
    <table class="glass-table">
      <thead><tr><th>الطول (سم)</th><th>العرض (سم)</th><th>العدد</th><th>المساحة (فوت²)</th><th></th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <div style="margin-top:10px;font-weight:900;text-align:left">الإجمالي: <span id="glassTotalVal">${total.toFixed(2)}</span> فوت²</div>
  </div>
  <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
    <button class="btn" onclick="glassAddRow()">+ إضافة صف</button>
    <button class="btn primary" onclick="glassExportShare()">📤 تصدير ومشاركة عبر واتساب</button>
    <button class="btn" onclick="glassCopyText()">📋 نسخ نص الطلب</button>
    <button class="btn danger" onclick="glassClearAll()">مسح الكل</button>
  </div>`;
}
function admGlassCalc(){
  ensureGlassState();
  return `<div class="adm-topbar"><h2>حاسبة الزجاج</h2></div>
  <div style="max-width:640px">
    <div class="field"><label>نوع الزجاج</label>
      <input id="glassTypeInput" value="${esc(window.glassType)}" placeholder="مثال: زجاج سيكوريت 8 ملم شفاف"
        oninput="window.glassType=this.value; const d=document.getElementById('glassTypeDisplay'); if(d) d.textContent=this.value||'—'; glassSaveState();">
    </div>
    <div class="field"><label>رقم واتساب محل الزجاج (اختياري)</label>
      <input id="glassPhone" value="${esc(window.glassPhone)}" placeholder="مثال: 07701234567" oninput="window.glassPhone=this.value; glassSaveState();">
      <div class="hint">إذا تركته فاضي، رح يفتح واتساب على رقم الورشة المسجّل بالإعدادات.</div>
    </div>
    <div id="glassCalcBox">${glassTableHtml()}</div>
  </div>`;
}
window.glassUpdateRow = function(i, field, value){
  window.glassRows[i][field] = value;
  const cell = document.getElementById('glassArea_'+i);
  if(cell) cell.textContent = glassRowArea(window.glassRows[i]).toFixed(2);
  if(field==='length'){ const el=document.getElementById('glassLenFt_'+i); if(el) el.textContent = cmToFeetLabel(value); }
  if(field==='width'){ const el=document.getElementById('glassWidFt_'+i); if(el) el.textContent = cmToFeetLabel(value); }
  glassUpdateTotal();
  glassSaveState();
};
window.glassAddRow = function(){
  window.glassRows.push({length:'',width:'',qty:1});
  document.getElementById('glassCalcBox').innerHTML = glassTableHtml();
  glassSaveState();
};
window.glassRemoveRow = function(i){
  window.glassRows.splice(i,1);
  if(!window.glassRows.length) window.glassRows = [{length:'',width:'',qty:1}];
  document.getElementById('glassCalcBox').innerHTML = glassTableHtml();
  glassSaveState();
};
window.glassClearAll = function(){
  window.glassRows = [{length:'',width:'',qty:1}];
  document.getElementById('glassCalcBox').innerHTML = glassTableHtml();
  glassSaveState();
};
function glassBuildText(rows, total){
  return `السلام عليكم\nطلب قياسات زجاج\nنوع الزجاج: ${window.glassType||''}\n` +
    rows.map((r,i)=>`${i+1}) ${r.length}×${r.width} سم × ${r.qty} = ${glassRowArea(r).toFixed(2)} فوت²`).join('\n') +
    `\nالإجمالي: ${total.toFixed(2)} فوت²`;
}
window.glassCopyText = async function(){
  const rows = window.glassRows.filter(r => Number(r.length)>0 && Number(r.width)>0 && Number(r.qty)>0);
  if(!rows.length){ toast('أدخل قياسات صحيحة أولاً', true); return; }
  const total = rows.reduce((s,r)=>s+glassRowArea(r),0);
  const text = glassBuildText(rows, total);
  try{ await navigator.clipboard.writeText(text); toast('تم نسخ النص'); }
  catch(e){ toast('تعذّر النسخ التلقائي — انسخه يدوياً', true); }
};
window.glassExportShare = async function(){
  const rows = window.glassRows.filter(r => Number(r.length)>0 && Number(r.width)>0 && Number(r.qty)>0);
  if(!rows.length){ toast('أدخل قياسات صحيحة أولاً', true); return; }
  if(!(window.glassPhone||'').trim()) await getSettings();
  let total = 0;
  const trs = rows.map((r,i)=>{
    const area = glassRowArea(r); total += area;
    return `<tr><td style="padding:8px;border:1px solid #e2e8f0">${i+1}</td><td style="padding:8px;border:1px solid #e2e8f0">${esc(r.length)}</td><td style="padding:8px;border:1px solid #e2e8f0">${esc(r.width)}</td><td style="padding:8px;border:1px solid #e2e8f0">${esc(r.qty)}</td><td style="padding:8px;border:1px solid #e2e8f0">${area.toFixed(2)}</td></tr>`;
  }).join('');
  const printHtml = `<div id="glassPrintCard" style="position:fixed;left:-9999px;top:0;width:420px;background:#fff;padding:20px;font-family:Tajawal,sans-serif;direction:rtl;color:#0F172A">
    <div style="font-weight:900;font-size:18px;margin-bottom:4px">طلب قياسات زجاج</div>
    <div style="font-weight:700;font-size:14px;color:#0EA5E9;margin-bottom:14px">نوع الزجاج: ${esc(window.glassType||'—')}</div>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#F1F5F9">
        <th style="padding:8px;border:1px solid #e2e8f0">#</th>
        <th style="padding:8px;border:1px solid #e2e8f0">الطول(سم)</th>
        <th style="padding:8px;border:1px solid #e2e8f0">العرض(سم)</th>
        <th style="padding:8px;border:1px solid #e2e8f0">العدد</th>
        <th style="padding:8px;border:1px solid #e2e8f0">المساحة(فوت²)</th>
      </tr></thead>
      <tbody>${trs}</tbody>
    </table>
    <div style="margin-top:12px;font-weight:900;font-size:15px;text-align:left">الإجمالي: ${total.toFixed(2)} فوت²</div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend', printHtml);
  const node = document.getElementById('glassPrintCard');
  const waText = glassBuildText(rows, total);
  try{
    const canvas = await html2canvas(node, {scale:2, backgroundColor:'#ffffff'});
    node.remove();
    canvas.toBlob(async (blob)=>{
      if(!blob){ toast('صار خطأ بإنشاء الصورة', true); return; }
      const file = new File([blob], 'قياسات-زجاج.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'قياسات زجاج', text: waText}); return; }
        catch(e){ /* المستخدم ألغى المشاركة أو فشلت — نكمل بالطريقة البديلة */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'قياسات-زجاج.png'; a.click();
      URL.revokeObjectURL(url);
      const phone = (window.glassPhone||'').trim();
      const link = phone ? waLinkToPhone(phone, waText) : waLinkWorkshop(waText);
      if(link) window.open(link, '_blank');
      toast('تم تنزيل الصورة — أرفقها يدوياً بمحادثة واتساب اللي فتحناها');
    }, 'image/png');
  }catch(e){ node.remove(); console.error(e); toast('صار خطأ بالتصدير', true); }
};

  const s = data||{};
  window.__SETTINGS_ADM = s;
  return `<div class="adm-topbar"><h2>إعدادات الموقع</h2></div>
  <div style="max-width:520px">
    ${fld({key:'workshop_name',label:'اسم الورشة'},s.workshop_name)}

    <div class="row2">${fld({key:'founded_year',label:'سنة التأسيس (لعرض سنوات الخبرة بالرئيسية)',type:'number'},s.founded_year)}${fld({key:'projects_completed',label:'عدد المشاريع المنفذة (اختياري)',type:'number'},s.projects_completed)}</div>
    <div class="row2">${fld({key:'phone',label:'الهاتف'},s.phone)}${fld({key:'whatsapp_number',label:'رقم واتساب'},s.whatsapp_number)}</div>
    ${fld({key:'country_code',label:'رمز الدولة'},s.country_code||'+964')}
    <div class="row2">${fld({key:'governorate',label:'المحافظة'},s.governorate)}${fld({key:'address',label:'العنوان'},s.address)}</div>
    <div class="row2">${fld({key:'work_hours',label:'ساعات الدوام'},s.work_hours)}${fld({key:'email',label:'البريد الإلكتروني'},s.email)}</div>
    ${fld({key:'google_maps_url',label:'رابط خرائط قوقل'},s.google_maps_url)}
    <div class="row2">${fld({key:'facebook_url',label:'رابط فيسبوك (اختياري)'},s.facebook_url)}${fld({key:'instagram_url',label:'رابط انستغرام (اختياري)'},s.instagram_url)}</div>
    ${fld({key:'cod_enabled',label:'الدفع عند الاستلام مفعّل',type:'checkbox'},s.cod_enabled!==false)}
    <div class="toolbar" style="margin-top:16px"><b>الدفع الإلكتروني</b></div>
    ${fld({key:'electronic_payment_enabled',label:'تفعيل خيار الدفع الإلكتروني بالسلة',type:'checkbox'},!!s.electronic_payment_enabled)}
    ${fld({key:'payment_provider_name',label:'اسم مزود الدفع (يظهر للزبون، مثال: زين كاش)'},s.payment_provider_name)}
    <div class="field hint" style="margin-top:-8px">ملاحظة: هذا يجهّز الموقع لاستقبال مزود دفع حقيقي لاحقاً بدون تعديل الصفحات. لحين ربط مزود فعلي عبر المطوّر، الطلبات الإلكترونية تُسجَّل بحالة "بانتظار الدفع" ويتابعها الموظف يدوياً.</div>
    <div class="field"><label>شعار الورشة</label><input type="file" id="logoFile" accept="image/*">${s.logo_url?`<img src="${esc(s.logo_url)}" style="width:60px;margin-top:8px;border-radius:8px">`:''}</div>
    <div class="field"><label>صورة غلاف الموقع (تظهر بأعلى الصفحة الرئيسية)</label><input type="file" id="coverFile" accept="image/*">${s.cover_url?`<img src="${esc(s.cover_url)}" style="width:100%;max-width:260px;margin-top:8px;border-radius:8px">`:''}</div>
    <button class="btn primary block" onclick="settingsSave()">حفظ الإعدادات</button>
  </div>`;
}
window.settingsSave = async function(){
  const row = {
    workshop_name: readFld({key:'workshop_name'}), description: readFld({key:'description'}),
    founded_year: readFld({key:'founded_year',type:'number'}), projects_completed: readFld({key:'projects_completed',type:'number'}),
    phone: readFld({key:'phone'}), whatsapp_number: readFld({key:'whatsapp_number'}),
    country_code: readFld({key:'country_code'}), governorate: readFld({key:'governorate'}),
    address: readFld({key:'address'}), work_hours: readFld({key:'work_hours'}), email: readFld({key:'email'}),
    google_maps_url: readFld({key:'google_maps_url'}), cod_enabled: readFld({key:'cod_enabled',type:'checkbox'}),
    facebook_url: readFld({key:'facebook_url'}), instagram_url: readFld({key:'instagram_url'}),
    electronic_payment_enabled: readFld({key:'electronic_payment_enabled',type:'checkbox'}),
    payment_provider_name: readFld({key:'payment_provider_name'})
  };
  const file = document.getElementById('logoFile').files[0];
  if(file){
    const path = `${Date.now()}_${uid()}.${file.name.split('.').pop()}`;
    const {error:upErr} = await sb.storage.from('site-assets').upload(path,file);
    if(!upErr) row.logo_url = sb.storage.from('site-assets').getPublicUrl(path).data.publicUrl;
  }
  const coverFile = document.getElementById('coverFile').files[0];
  if(coverFile){
    const path = `${Date.now()}_${uid()}.${coverFile.name.split('.').pop()}`;
    const {error:upErr} = await sb.storage.from('site-assets').upload(path,coverFile);
    if(!upErr) row.cover_url = sb.storage.from('site-assets').getPublicUrl(path).data.publicUrl;
  }
  const {error} = await sb.from('site_settings').update(row).eq('id',1);
  if(error){ toast(error.message, true); return; }
  toast('تم حفظ الإعدادات'); state.settings=null;
};

// ---- change password ----
function admChangePassword(){
  return `<div class="adm-topbar"><h2>تغيير كلمة المرور</h2></div>
  <div style="max-width:420px">
    <div class="field hint" style="margin-bottom:14px">اكتب كلمة مرور جديدة لحسابك (٦ أحرف على الأقل).</div>
    ${fld({key:'new_password',label:'كلمة المرور الجديدة',type:'password'})}
    ${fld({key:'confirm_password',label:'تأكيد كلمة المرور',type:'password'})}
    <button class="btn primary block" id="changePassBtn" onclick="changePasswordSave()">تحديث كلمة المرور</button>
  </div>`;
}
window.changePasswordSave = async function(){
  const p1 = readFld({key:'new_password'});
  const p2 = readFld({key:'confirm_password'});
  if(!p1 || p1.length<6){ toast('كلمة المرور لازم تكون ٦ أحرف على الأقل', true); return; }
  if(p1!==p2){ toast('كلمتا المرور غير متطابقتين', true); return; }
  const btn=document.getElementById('changePassBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const {error} = await sb.auth.updateUser({password:p1});
  btn.disabled=false; btn.textContent='تحديث كلمة المرور';
  if(error){ toast('صار خطأ: '+error.message, true); return; }
  toast('تم تحديث كلمة المرور بنجاح');
  document.getElementById('f_new_password').value='';
  document.getElementById('f_confirm_password').value='';
};

// -------------------- boot --------------------
sb.auth.onAuthStateChange((_e, session)=>{
  state.session=session;
  if(_e==='PASSWORD_RECOVERY'){ location.hash='#/'+ADMIN_ROUTE+'/change-password'; render(); }
});
render();
</script>
